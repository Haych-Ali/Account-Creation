<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  
  <title>Account Creation</title>

  
</head>
<body>
  <header class="header">
    <h1>Account Creation</h1>
    <p> Create your account by filling out the form below.</p>

  </header>
  <!-- making the main container that holds the form -->
  <main class ="container"> 
    <!-- another containter that holds the form -->
    <div class = "form-sheet">
      <form>
        <div class="row">
          <!-- first name -->
          <div class ="col-md-6">
            <label for ="firstname">
              First name
            </label>
            <input type="text" id="firstname" name="firstname" class="form-control" >
          </div>
          <!-- last name -->
          <div class = "col-md-6">
            <label for="lastname">
              Last Name
            </label>
            <input type="text" id="lastname" class="form-control">
          </div>
        </div>
        <!-- Date of birth -->
        <div class="row">
          <div class="col-md-6">
            <label for="DateOfBirth">
              Date Of Birth
            </label>
            <input type="date" id="DateOfBirth" class="form-control" placeholder="mm/dd/yyyy">
          </div>

          <div class="col-md-6">
            <label for="SSN">
              Social Security Number
            </label>
            <input type="text" inputmode="numeric" pattern="[0-9]{9}" id="SSN" class="form-control">
          </div>
        </div>

        <!-- phone number -->
        <div class ="mb-3">
          <label for="PhoneNumber">
            Phone number
          </label>
          <input type="tel" id="PhoneNumber" maxlength="15" class="form-control">
        </div>

        <!-- address -->
        <div class ="mb-3">
          <label for="Address">
            Address
          </label>
          <input type="text" id="Address" class="form-control">
        </div>

        <!-- City and State -->
        <div class="row">
          <div class="col-md-6">
            <label for="City">City</label>
            <input type="text" id="City" class="form-control">
          </div>
          <div class="col-md-6">
            <label for="City">
              State
            </label>
            <input type="text" id="State" class="form-control">
          </div>
        </div>

        <!-- ZIP code -->
        <div class="mb-3">
          <label for="ZIPcode">
            Zip code
          </label>
          <input type="text"  id="ZIPcode" class="form-control">
        </div>

        <!-- checkbox -->
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="" id="checkDefault" >
          <label class="form-check-label" for="checkDefault">
            I agree to the Terms
          </label>
        </div>

        <!-- create account button -->
        <div class="d-grid gap-2">
          <button class="btn btn-primary" type="button">
            Create Account
          </button>
        </div>
      </form>
        

    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
